<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello</title>
  </head>
  <body>
    <div id="topbar" style="display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #ccc;">
      <div><a href="/">EcoCode by EcoCode</a></div>
      <div>
        {% if get_current_user(request) %}
          <a href="/profile">{{ get_current_user(request) }}</a>
        {% else %}
          <a href="/login">Log In</a> | <a href="/signup">Sign Up</a>
        {% endif %}
      </div>
    </div>

    <main style="padding:16px;margin-bottom:48px;">
      <h1>Hello World</h1>
      <p>Welcome, {{ user }}!</p>
      <p><a href="/">Home</a></p>
    </main>

    <footer style="position:fixed;bottom:0;width:100%;text-align:center;padding:8px;background:#fff;border-top:1px solid #eee;">by EcoCode</footer>
  </body>
</html>
