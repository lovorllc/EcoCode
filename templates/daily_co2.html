<!doctype html>
<html lang="hr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCode - CO₂ Insights</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* SVJETLA ECO TEMA */
            --bg: #f0fdf4; /* Vrlo blaga zelena pozadina */
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-main: #064e3b;
            --text-soft: #374151;
            --glass-border: rgba(16, 185, 129, 0.2);
            --shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.1);
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            /* TAMNA ECO GLASS TEMA */
            --bg: #020617;
            --accent: #34d399;
            --accent-glow: rgba(52, 211, 153, 0.3);
            --card-bg: rgba(15, 23, 42, 0.7);
            --text-main: #f0fdf4;
            --text-soft: #94a3b8;
            --glass-border: rgba(52, 211, 153, 0.1);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --input-bg: rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, var(--accent-glow) 0px, transparent 40%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- TOPBAR --- */
        #topbar {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-weight: 800; font-size: 1.5rem; color: var(--text-main);
            text-decoration: none; display: flex; align-items: center; gap: 12px;
        }
        .logo span { color: var(--accent); }

        .btn-profile {
            background: var(--accent);
            color: white !important;
            padding: 10px 22px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 15px -3px var(--accent-glow);
        }

        /* --- CONTENT --- */
        main { max-width: 1100px; margin: 0 auto; width: 100%; padding: 40px 5%; }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 { font-size: 2.8rem; font-weight: 800; margin: 0; letter-spacing: -0.04em; }

        /* --- KARTICE --- */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            position: relative;
        }

        .glass-card::before {
            content: ""; position: absolute; top: 0; left: 30px; right: 30px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        /* --- KONTROLE --- */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--input-bg);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        select {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
        }

        /* --- GRAFIKON --- */
        .chart-container { height: 450px; width: 100%; margin-top: 20px; }

        .legend-custom {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; color: var(--text-soft); }
        .dot { width: 12px; height: 12px; border-radius: 4px; }

        footer { text-align: center; padding: 40px; color: var(--text-soft); font-size: 0.85rem; }

        .logo-box {
            width: 40px; height: 40px; 
            border-radius: 12px; object-fit: contain;
        }

    </style>
</head>
<body>

    <nav id="topbar">
        <a href="/" class="logo">
            <img src="/static/logo.png" alt="EcoCode" class="logo-box">
            EcoCode <span>Insights</span>
        </a>
        <a href="/profile" class="btn-profile">👤 {{ user.username }}</a>
    </nav>

    <main>
        <div class="header-section">
            <div>
                <h1>Statistika Emisija</h1>
                <p style="color: var(--text-soft);">Vizualni pregled vašeg utjecaja na okoliš.</p>
            </div>
            
            <form method="get" id="rangeForm">
                <div class="controls">
                    <label style="font-size: 0.8rem; font-weight: 800; text-transform: uppercase; color: var(--accent);">Vrijeme:</label>
                    <select name="range" onchange="this.form.submit()">
                        <option value="hour" {% if range == 'hour' %}selected{% endif %}>Danas</option>
                        <option value="week" {% if range == 'week' %}selected{% endif %}>Zadnjih 7 dana</option>
                        <option value="month" {% if range == 'month' %}selected{% endif %}>Zadnjih 30 dana</option>
                    </select>
                </div>
            </form>
        </div>

        <section class="glass-card">
            <div class="chart-container">
                <canvas id="dailyChart"></canvas>
            </div>

            <div class="legend-custom">
                <div class="legend-item"><div class="dot" style="background: #10b981;"></div> Bazna CO₂</div>
                <div class="legend-item"><div class="dot" style="background: #fbbf24;"></div> Aktivnosti</div>
            </div>
        </section>
    </main>

    <footer>
        Analiza footprinta za datum: <strong>{{ date }}</strong> • by EcoCode
    </footer>

    

[Image of carbon footprint chart]


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const isDark = savedTheme === 'dark';

        // Inicijalizacija Chart-a s novim bojama
        const ctx = document.getElementById('dailyChart').getContext('2d');
        const labels = {{ (hours or points) | map(attribute='date' if points else 'hour') | list | tojson }};
        const baseData = {{ (hours or points) | map(attribute='base_kg') | list | tojson }};
        const activityData = {{ (hours or points) | map(attribute='activity_kg') | list | tojson }};

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Baza',
                        data: baseData,
                        backgroundColor: '#10b981',
                        borderRadius: 10,
                    },
                    {
                        label: 'Aktivnosti',
                        data: activityData,
                        backgroundColor: isDark ? '#fbbf24' : '#ffab40',
                        borderRadius: 10,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { 
                        stacked: true, 
                        grid: { display: false },
                        ticks: { color: isDark ? '#94a3b8' : '#374151' }
                    },
                    y: { 
                        stacked: true,
                        grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' },
                        ticks: { color: isDark ? '#94a3b8' : '#374151' }
                    }
                }
            }
        });
    </script>
</body>
</html>
