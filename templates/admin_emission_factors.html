<!doctype html>
<html lang="hr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCode Admin - CO₂ Faktori</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* SVJETLA TEMA */
            --bg: #f8fafc;
            --accent-blue: #3b82f6;
            --accent-glow: #1d4ed8;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-soft: #64748b;
            --glass-border: rgba(15, 23, 42, 0.1);
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            --input-bg: rgba(255, 255, 255, 0.9);
            --neon-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        [data-theme="dark"] {
            /* TAMNA TEMA */
            --bg: #030712;
            --accent-blue: #3b82f6;
            --accent-glow: #1d4ed8;
            --card-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-soft: #94a3b8;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            --input-bg: rgba(0, 0, 0, 0.3);
            --neon-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(29, 78, 216, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- TOPBAR --- */
        #topbar {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
            height: 66px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-weight: 800; font-size: 1.5rem; color: var(--text-main);
            text-decoration: none; display: flex; align-items: center;
        }
        .logo span { color: var(--accent-blue); }

        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-soft); font-weight: 600; font-size: 0.9rem; }
        .nav-links a:hover { color: var(--accent-blue); }

        .btn-nav-admin {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-glow));
            color: white !important;
            padding: 10px 24px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: var(--neon-shadow);
        }

        /* --- MAIN CONTENT --- */
        main { max-width: 1200px; margin: 0 auto; width: 100%; padding: 40px 5%; }

        .hero-text { margin-bottom: 40px; animation: fadeInUp 0.8s ease; }
        .hero-text small { color: var(--accent-blue); font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; }
        .hero-text h1 { font-size: 3rem; font-weight: 800; margin: 5px 0 0; letter-spacing: -0.04em; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-grid { display: grid; grid-template-columns: 1.8fr 1fr; gap: 30px; }

        /* --- KARTICE --- */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 30px;
            border: 1px solid var(--glass-border);
            position: relative;
            box-shadow: var(--shadow);
        }

        .glass-card::before {
            content: "";
            position: absolute;
            top: 0; left: 30px; right: 30px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
        }

        h3 { font-size: 1.2rem; margin-top: 0; margin-bottom: 25px; font-weight: 700; color: var(--text-main); }

        /* --- TABLICA --- */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: var(--text-soft); border-bottom: 1px solid var(--glass-border); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 16px 12px; border-bottom: 1px solid var(--glass-border); font-size: 0.9rem; color: var(--text-main); }
        tr:hover { background: rgba(59, 130, 246, 0.05); }

        /* --- FORMA --- */
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; font-weight: 600; color: var(--text-soft); }
        input {
            width: 100%; padding: 14px 18px; background: var(--input-bg);
            border: 1px solid var(--glass-border); border-radius: 16px;
            color: var(--text-main); font-family: inherit; font-size: 0.95rem;
        }
        input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

        .btn-action {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-glow));
            color: white; font-weight: 800; cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            font-size: 1rem;
        }
        .btn-action:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: var(--neon-shadow); }

        .btn-small { 
            padding: 6px 12px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: transparent; color: var(--text-main); cursor: pointer; font-weight: 600; font-size: 0.8rem;
        }
        .btn-small:hover { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        @media (max-width: 950px) { .main-grid { grid-template-columns: 1fr; } }

        .logo-box {
            width: 95px; height: 95px;
            min-width: 95px; min-height: 95px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 16px;
            object-fit: contain;
            margin-top: -10px; margin-bottom: -10px;
        }

    </style>
</head>
<body>

    <nav id="topbar">
        <a href="/" class="logo"><img src="/static/logo.png" alt="EcoCode" class="logo-box"> EcoCode</a>
        <div>
            {% if get_current_user(request) %}
                <span class="dev-badge">ADMIN: {{ get_current_user(request) }}</span>
            {% endif %}
        </div>
    </nav>

    <main>
        <div class="hero-text">
            <small>Faktori Emisije</small>
            <h1>CO₂ Vrijednosti</h1>
        </div>

        <div class="main-grid">
            <section class="glass-card">
                <h3>Popis vrijednosti</h3>
                <div class="table-wrap" id="efWrap">Učitavanje...</div>
            </section>

            <section class="glass-card">
                <h3>Novi faktor</h3>
                <div class="input-group">
                    <label>Kategorija</label>
                    <input id="ef_category" placeholder="npr. Transport">
                </div>
                <div class="input-group">
                    <label>Podvrsta</label>
                    <input id="ef_subtype" placeholder="npr. car">
                </div>
                <div class="input-group">
                    <label>Jedinica</label>
                    <input id="ef_unit" placeholder="npr. km">
                </div>
                <div class="input-group">
                    <label>CO₂ po jedinici (kg)</label>
                    <input id="ef_value" type="number" step="0.001" placeholder="0.000">
                </div>
                <div class="input-group">
                    <label>Izvor podataka</label>
                    <input id="ef_source" placeholder="Opcionalno">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display:flex;align-items:center;gap:10px; cursor:pointer; font-size: 0.9rem;">
                        <input type="checkbox" id="ef_apply" style="width:18px; height:18px;"> Primijeni na postojeće
                    </label>
                </div>
                <button onclick="createEF()" class="btn-action">Dodaj faktor</button>
                <div id="efCreateMsg" style="margin-top: 15px; text-align: center; font-size: 0.85rem; font-weight: 600; color: var(--accent-blue);"></div>
            </section>
        </div>
    </main>

    <script>
        // SINHRONIZACIJA TEME
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        async function fetchEFs(){
            const r = await fetch('/api/emission_factors');
            const j = await r.json();
            const f = j.factors || [];
            const el = document.getElementById('efWrap');
            if(!f.length){ el.innerHTML = 'Nema faktora.'; return; }
            let html = '<table><thead><tr><th>Kat.</th><th>Tip</th><th>Jed.</th><th>kg/j</th><th>Akcije</th></tr></thead><tbody>';
            f.forEach(e=>{
                html += `<tr>
                    <td><strong>${e.category}</strong></td>
                    <td>${e.subtype||'-'}</td>
                    <td>${e.unit||'-'}</td>
                    <td style="font-weight:700; color:var(--accent-blue)">${e.co2_kg_per_unit}</td>
                    <td>
                        <div style="display:flex; gap:5px;">
                            <button class="btn-small" onclick="editEF(${e.id},'${(e.category||'').replace(/'/g, "\\'")}','${(e.subtype||'').replace(/'/g, "\\'")}', '${e.unit||''}', ${e.co2_kg_per_unit || 0}, '${(e.source||'').replace(/'/g, "\\'")}')">Uredi</button>
                            <button class="btn-small" style="color:#ef4444" onclick="deleteEF(${e.id})">X</button>
                        </div>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            el.innerHTML = html;
        }

        async function createEF(){
            const cat = document.getElementById('ef_category').value.trim();
            if(!cat){ alert('Kategorija je obavezna!'); return; }
            const payload = new URLSearchParams();
            payload.append('category', cat);
            payload.append('subtype', document.getElementById('ef_subtype').value||'');
            payload.append('unit', document.getElementById('ef_unit').value||'');
            payload.append('co2_kg_per_unit', document.getElementById('ef_value').value||'0');
            payload.append('source', document.getElementById('ef_source').value||'');
            const r = await fetch('/api/emission_factors', { method: 'POST', body: payload });
            if(r.ok) {
                document.getElementById('efCreateMsg').textContent = 'Dodano!';
                fetchEFs();
            }
        }

        async function editEF(id, category, subtype, unit, value, source){
            const newVal = prompt('Novi iznos CO₂ (kg/unit):', value); if(newVal===null) return;
            const payload = new URLSearchParams(); payload.append('co2_kg_per_unit', newVal);
            await fetch(`/api/emission_factors/${id}/update`, { method: 'POST', body: payload });
            fetchEFs();
        }

        async function deleteEF(id){
            if(!confirm('Obriši?')) return;
            await fetch(`/api/emission_factors/${id}/delete`, { method: 'POST' });
            fetchEFs();
        }

        window.onload = fetchEFs;
    </script>
</body>
</html>
